name: Bug report
description: Something in the template doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the full error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. pnpm install
        2. pnpm dev
        3. ...
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Node 24.15.0, pnpm 12.4.2, macOS 16
